spring.application.name=vehicle-service

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vehicle_db?options=-c%20TimeZone=Asia/Kolkata}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect