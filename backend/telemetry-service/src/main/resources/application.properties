spring.application.name=telemetry-service

server.port=8082

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://vehicle-postgres:5432/vehicle_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# Microservice Communication
alert.service.url=${ALERT_SERVICE_URL:http://alert-service:8083}
vehicle.service.url=${VEHICLE_SERVICE_URL:http://vehicle-service:8081}
